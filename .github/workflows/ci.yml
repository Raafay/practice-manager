name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: pm
          POSTGRES_DB: pm_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pm:pm@localhost:5432/pm_dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (PostgreSQL)
        run: uv run pytest
      - name: Migrations are complete
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Smoke test on SQLite
        env:
          DATABASE_URL: sqlite:///smoke.sqlite3
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_demo
