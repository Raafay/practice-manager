<h2 class="mb-3">Example drawer</h2>
<p class="muted mb-4">Drawers hold a record's details or a short form without leaving the page.</p>
<form class="space-y-4" method="get" action="{% url 'core:styleguide' %}">
  <div><label class="label" for="drawer-name">Name</label><input id="drawer-name" class="input" autofocus></div>
  <div class="flex gap-2"><button type="submit" class="btn btn-primary">Save</button><button type="button" class="btn btn-secondary" data-dialog-close>Cancel</button></div>
</form>
