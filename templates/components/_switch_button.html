{# A switch that opens a dialog (url is the dialog's address), or with post=True and a target, changes at once and swaps the target. #}
<button type="button" role="switch" class="switch-button" aria-checked="{% if on %}true{% else %}false{% endif %}" {% if disabled %}disabled{% elif post %}hx-post="{{ url }}" hx-target="{{ target }}" hx-swap="outerHTML"{% else %}hx-get="{{ url }}" hx-target="#modal-body"{% endif %}>
  <span class="switch-track" aria-hidden="true"></span>
  <span>{{ label }}</span>
  <span class="text-xs font-medium {% if on %}text-green-700{% else %}text-slate-500{% endif %}">{% if on %}On{% else %}Off{% endif %}</span>
</button>
