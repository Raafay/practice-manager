{# An empty list says what to do next. Pass title, message, and optionally action_url and action_label. #}
<div class="empty">
  {% icon icon_name|default:"inbox" "size-8 text-slate-400" %}
  <p class="font-medium text-slate-800">{{ title }}</p>
  {% if message %}<p class="muted max-w-md">{{ message }}</p>{% endif %}
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-primary mt-2">{{ action_label }}</a>{% endif %}
</div>
