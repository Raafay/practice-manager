{% extends "base.html" %}
{% block body %}
<main id="main" class="flex min-h-screen flex-col items-center justify-center px-4 py-10">
  <div class="mb-6 flex items-center gap-2 text-slate-700">
    {% icon "building-office" "size-6 text-accent" %}
    <span class="text-lg font-semibold">{{ practice.practice_name }}</span>
  </div>
  <div class="card w-full max-w-md">
    <div class="card-body space-y-4 p-6">
      {% block content %}{% endblock content %}
    </div>
  </div>
  {% block below_card %}{% endblock below_card %}
</main>
{% endblock body %}
