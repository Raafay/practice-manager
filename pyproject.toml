[project]
name = "practice-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "cryptography>=50.0.2",
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "django-allauth[mfa]>=65.19.7",
    "django-anymail>=15.2",
    "django-axes>=8.3.1",
    "django-htmx>=1.29.0",
    "django-storages[s3]>=1.14.6",
    "django-tailwind-cli>=4.8.1",
    "gunicorn>=26.2.0",
    "nh3>=0.3.7",
    "psycopg[binary]>=3.3.6",
    "segno>=1.6.6",
    "sentry-sdk>=2",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["static/vendor", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["S101", "S105", "S106", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S311", "S106", "S105"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps", "config"]
addopts = "-q --tb=short --no-header"
filterwarnings = [
    "ignore::DeprecationWarning:allauth.*",
    "ignore:No directory at:UserWarning",
]
